[project]
name = "flask-fullstack-framework"
version = "3.0.0"
description = "A reusable application framework on Flask with declarative HTML and JSON resources"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: live integration with a disposable PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["database/migrations/versions", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
