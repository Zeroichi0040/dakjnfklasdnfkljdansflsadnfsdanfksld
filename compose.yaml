# Optional local full-stack example. No cloud subscription is needed.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: application
      POSTGRES_DB: application
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first or set a unique POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U application -d application"]
      interval: 5s
      retries: 10
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Run setup first or set a unique SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://application:${POSTGRES_PASSWORD}@database/application
      PUBLIC_BASE_URL: http://localhost:8000
      SESSION_COOKIE_SECURE: "false"
      TRUSTED_HOSTS: localhost,127.0.0.1
      MAIL_TRANSPORT: disabled
      PROXY_FIX_HOPS: "0"
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres_data:
